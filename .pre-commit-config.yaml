repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-yaml
  - repo: local
    hooks:
      - id: candidate-service-schema
        name: Candidate service declaration schema
        entry: check-jsonschema --schemafile tools/lope/lope-service-contract-v1.schema.json lope-service.json
        language: python
        additional_dependencies: [check-jsonschema==0.36.0]
        pass_filenames: false
        always_run: true
      - id: node-version
        name: Pinned Node toolchain
        entry: >-
          node -e "if (process.versions.node !== '24.18.1') { throw new Error('Use Node 24.18.1 from .nvmrc') }"
        language: system
        pass_filenames: false
        always_run: true
      - id: immutable-dependencies
        name: CE+ dependency graph is immutable
        entry: env npm_config_cache_folder=node_modules/.cache/lope-yarn-v1 corepack yarn install --immutable --mode=skip-build
        language: system
        pass_filenames: false
        always_run: true
      - id: generate-public-parsers
        name: Generate actual public LaTeX and BibTeX parsers
        entry: corepack yarn workspace @overleaf/web lezer-latex:generate
        language: system
        pass_filenames: false
        always_run: true
      - id: public-backend-types
        name: Public CE+ backend types
        entry: corepack yarn workspace @overleaf/web exec tsc -p tsconfig.backend.ce.json --noEmit --pretty false
        language: system
        pass_filenames: false
        always_run: true
      - id: public-frontend-types
        name: Public CE+ production frontend types
        entry: corepack yarn workspace @overleaf/web exec tsc -p tsconfig.ce.json --noEmit --pretty false
        language: system
        pass_filenames: false
        always_run: true
      - id: new-frontend-test-types
        name: Strict types for new frontend regression tests
        entry: corepack yarn workspace @overleaf/web exec tsc -p tsconfig.lope-tests.json --noEmit --pretty false
        language: system
        pass_filenames: false
        always_run: true
      - id: clsi-types
        name: CLSI declarations, lock ownership and fresh source types
        entry: corepack yarn workspace @overleaf/clsi types:check
        language: system
        pass_filenames: false
        always_run: true
      - id: clsi-archive-types
        name: Strict types for CLSI archive and ephemeral jobs
        entry: corepack yarn workspace @overleaf/clsi types:archive
        language: system
        pass_filenames: false
        always_run: true
      - id: dependency-security-types
        name: Strict checked JavaScript for dependency security regressions
        entry: corepack yarn workspace @overleaf/web exec tsc -p tsconfig.dependency-security.json --noEmit --pretty false
        language: system
        pass_filenames: false
        always_run: true
      - id: github-auth-types
        name: Strict checked GitHub token manager and auth regression types
        entry: corepack yarn workspace @overleaf/web exec tsc -p tsconfig.github-auth.json --noEmit --pretty false
        language: system
        pass_filenames: false
        always_run: true
      - id: github-auth-regressions
        name: Mocked GitHub token revocation and OAuth error regressions
        entry: >-
          corepack yarn workspace @overleaf/web exec vitest run
          --config vitest.config.js modules/github-sync/test/unit
          --passWithNoTests=false
        language: system
        pass_filenames: false
        always_run: true
      - id: git-bridge-quality
        name: Git bridge Java formatting, compilation and tests
        entry: tools/lope/check-git-bridge.sh
        language: system
        pass_filenames: false
        files: '^(services/git-bridge/(src/|pom\.xml$)|tools/lope/check-git-bridge\.sh$|\.pre-commit-config\.yaml$|\.github/workflows/lope-quality\.yml$)'
      - id: zotero-auth-types
        name: Strict checked Zotero failure and OAuth regression types
        entry: corepack yarn workspace @overleaf/web exec tsc -p tsconfig.zotero-auth.json --noEmit --pretty false
        language: system
        pass_filenames: false
        always_run: true
      - id: zotero-auth-regressions
        name: Zotero credential-safe failures and bounded OAuth regressions
        entry: >-
          corepack yarn workspace @overleaf/web exec vitest run
          --config vitest.config.js modules/zotero/test/unit
          --passWithNoTests=false
        language: system
        pass_filenames: false
        always_run: true
      - id: provider-https-types
        name: Strict checked provider CONNECT transport and regression types
        entry: corepack yarn workspace @overleaf/web exec tsc -p tsconfig.provider-https.json --noEmit --pretty false
        language: system
        pass_filenames: false
        always_run: true
      - id: provider-https-regressions
        name: Provider CONNECT TLS redirect cancellation and isolation regressions
        entry: >-
          corepack yarn workspace @overleaf/web exec vitest run
          --config vitest.config.js test/unit/src/Integrations/ProviderHttpsAgent.test.mjs
          --passWithNoTests=false
        language: system
        pass_filenames: false
        always_run: true
      - id: runtime-dependencies-types
        name: Strict checked image-only dependency projection and regressions
        entry: corepack yarn workspace @overleaf/web exec tsc -p tsconfig.runtime-dependencies.json --noEmit --pretty false
        language: system
        pass_filenames: false
        files: '^(server-ce/(Dockerfile$|runtime-(?:dependencies|audit)(?:\.test)?\.cjs$)|services/web/tsconfig\.runtime-dependencies\.json$|\.pre-commit-config\.yaml$|\.github/workflows/lope-quality\.yml$)'
      - id: runtime-dependencies-regressions
        name: Image-only dependency graph, payload and physical closure guards
        entry: node --test server-ce/runtime-dependencies.test.cjs server-ce/runtime-audit.test.cjs
        language: system
        pass_filenames: false
        files: '^(server-ce/(Dockerfile$|runtime-(?:dependencies|audit)(?:\.test)?\.cjs$)|services/web/tsconfig\.runtime-dependencies\.json$|\.pre-commit-config\.yaml$|\.github/workflows/lope-quality\.yml$)'
      - id: runtime-cleanup-types
        name: Strict checked final-image cleanup guards and regressions
        entry: corepack yarn workspace @overleaf/web exec tsc -p tsconfig.runtime-cleanup.json --noEmit --pretty false
        language: system
        pass_filenames: false
        files: '^(server-ce/(Dockerfile$|runtime-cleanup(?:\.test)?\.cjs$)|services/web/tsconfig\.runtime-cleanup\.json$|\.pre-commit-config\.yaml$|\.github/workflows/lope-quality\.yml$)'
      - id: runtime-cleanup-regressions
        name: Offline final-image package, path and build-context refusal controls
        entry: node --test server-ce/runtime-cleanup.test.cjs
        language: system
        pass_filenames: false
        files: '^(server-ce/(Dockerfile$|runtime-cleanup(?:\.test)?\.cjs$)|services/web/tsconfig\.runtime-cleanup\.json$|\.pre-commit-config\.yaml$|\.github/workflows/lope-quality\.yml$)'
      - id: portable-compose
        name: Portable Docker Compose configuration and types
        entry: >-
          bash -ec 'corepack yarn workspace @overleaf/web exec tsc -p tsconfig.portable-compose.json &&
          node --test tools/lope/check-portable-compose.mts'
        language: system
        pass_filenames: false
        files: '^(compose\.yaml$|deploy/|server-ce/(Dockerfile$|nginx/|init_scripts/200_nginx_config_template\.sh$)|tools/lope/check-portable-compose\.mts$|services/web/tsconfig\.portable-compose\.json$|\.pre-commit-config\.yaml$|\.github/workflows/lope-quality\.yml$)'
      - id: eslint
        name: Lint changed JavaScript and TypeScript (zero warnings)
        entry: corepack yarn exec eslint --max-warnings 0
        language: system
        files: '\.(cjs|mjs|js|jsx|ts|tsx|mts)$'
      - id: prettier
        name: Check formatting of changed maintained files
        entry: corepack yarn exec prettier --check --ignore-unknown
        language: system
        files: '\.(cjs|mjs|js|jsx|ts|tsx|mts|json|ya?ml|md)$'
      - id: compile-runner-regressions
        name: Compile runner, archive, job and lock ownership regressions
        entry: corepack yarn workspace @overleaf/clsi test:compiler-boundary
        language: system
        pass_filenames: false
        always_run: true
      - id: backend-regressions
        name: Public comment permissions and linked-file backend regressions
        entry: >-
          corepack yarn workspace @overleaf/web exec vitest run
          --config vitest.config.js modules/track-changes/test/unit
          modules/admin-tools/test/unit
          test/unit/src/Chat/ChatApiHandler.test.mjs
          test/unit/src/LinkedFiles/LinkedFilesController.test.mjs
          test/unit/src/Subscription/CustomerIoPlanHelpers.test.mjs
          test/unit/src/infrastructure/DependencySecurity.test.mjs
          test/unit/src/infrastructure/SendClientDisconnect.test.mjs
          test/unit/src/infrastructure/SystemInformationLinux.test.mjs
          test/unit/src/infrastructure/BodyParserCompatibility.test.mjs
          test/unit/src/infrastructure/DependencyParsers.test.mjs
          test/unit/src/infrastructure/EmailCredentials.test.mjs
          test/unit/src/Email/EmailSender.test.mjs
          test/unit/src/infrastructure/NodemailerCompatibility.test.mjs
          test/unit/src/infrastructure/NodemailerApplication.test.mjs
          test/unit/src/infrastructure/Multer.test.mjs
          test/unit/src/infrastructure/SanitizerQueryCompatibility.test.mjs
          test/unit/src/Email/EmailMessageHelper.test.mjs
          --passWithNoTests=false
        language: system
        pass_filenames: false
        always_run: true
      - id: frontend-regressions
        name: Public integration and administration frontend regressions
        entry: >-
          env NODE_ENV=test TZ=GMT corepack yarn workspace @overleaf/web exec
          mocha --timeout 15000 --exit --require test/frontend/bootstrap.js
          test/frontend/features/file-tree/flows/create-linked-file.test.tsx
          modules/github-sync/test/frontend/modal-state.test.tsx
          test/frontend/modules/admin-tools/unit/*.test.ts
          test/frontend/modules/template-gallery/unit/*.test.tsx
        language: system
        pass_filenames: false
        always_run: true
