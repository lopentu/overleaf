# Match the raw history route accepted by SourceDownloadUrls.ts and the relay.
map $request_uri $overleaf_compiler_blob {
    default 0;
    "~^/history/(?:global|project/(?:[0-9a-f]{24}|[1-9][0-9]{0,9}))/hash/[0-9a-f]{40}$" 1;
}

server {
    listen 127.0.0.1:37499;
    access_log off;
    error_log stderr crit;
    client_max_body_size 8m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Connection "";
        proxy_set_header Upgrade "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 660s;
        proxy_pass http://unix:/run/overleaf-compiler/relay/compile.sock;
    }
}

server {
    listen unix:/run/overleaf-compiler/filestore/filestore-http.sock;
    access_log off;
    error_log stderr crit;

    if ($request_method != GET) { return 405; }
    if ($overleaf_compiler_blob = 0) { return 404; }

    location / {
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host localhost;
        proxy_set_header Connection "";
        proxy_set_header Content-Length "";
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:3009;
    }
}
