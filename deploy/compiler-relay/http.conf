access_log off;
server_tokens off;
client_body_temp_path /tmp/client_body;
proxy_temp_path /tmp/proxy;
fastcgi_temp_path /tmp/fastcgi;
uwsgi_temp_path /tmp/uwsgi;
scgi_temp_path /tmp/scgi;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_tickets off;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /relay/tls/outbound-ca.pem;
proxy_ssl_certificate /relay/tls/outbound-client.pem;
proxy_ssl_certificate_key /relay/tls/outbound-client.key;

proxy_connect_timeout 3s;
proxy_http_version 1.1;
proxy_set_header Host localhost;
proxy_set_header Connection "";
proxy_set_header Upgrade "";
proxy_request_buffering off;
proxy_buffering off;

map $request_uri $compiler_path {
    default 0;
    "~^/project/[0-9a-f]{24}(?:/|\?|$)" 1;
}

# Match the exact raw route accepted by the worker's SourceDownloadUrls.ts.
map $request_uri $blob_path {
    default 0;
    "~^/history/(?:global|project/(?:[0-9a-f]{24}|[1-9][0-9]{0,9}))/hash/[0-9a-f]{40}$" 1;
}

upstream local_backend {
    server unix:/relay/input/upstream.sock;
}

upstream peer_transport {
    server unix:/relay/input/tunnel.sock;
}
