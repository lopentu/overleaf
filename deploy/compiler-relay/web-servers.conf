server {
    listen unix:/relay/run/compile.sock;
    include /relay/config/compiler.conf;
    proxy_ssl_name compile.overleaf.internal;

    location / {
        proxy_pass https://peer_transport;
    }
}

server {
    listen unix:/relay/run/peer.sock ssl;
    include /relay/config/inbound-tls.conf;
    if ($ssl_client_s_dn != "CN=overleaf-worker-filestore-client") { return 403; }
    include /relay/config/filestore.conf;

    location / {
        proxy_pass http://local_backend;
    }
}
