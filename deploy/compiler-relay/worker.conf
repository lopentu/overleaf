include /relay/config/process.conf;

http {
    include /relay/config/http.conf;
    include /relay/config/socket-backend.conf;

    server {
        listen unix:/relay/run/filestore.sock;
        include /relay/config/filestore.conf;
        proxy_ssl_name filestore.overleaf.internal;

        location / {
            proxy_pass https://peer_transport;
        }
    }

    server {
        listen unix:/relay/run/peer.sock ssl;
        include /relay/config/inbound-tls.conf;
        if ($ssl_client_s_dn != "CN=overleaf-web-compile-client") { return 403; }
        include /relay/config/compiler.conf;

        location / {
            proxy_pass http://local_backend;
        }
    }
}
