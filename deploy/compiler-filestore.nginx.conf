worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr crit;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Match the exact raw route accepted by the worker's SourceDownloadUrls.ts.
    map $request_uri $canonical_blob {
        default 0;
        "~^/history/(?:global|project/(?:[0-9a-f]{24}|[1-9][0-9]{0,9}))/hash/[0-9a-f]{40}$" 1;
    }

    upstream filestore_relay {
        server unix:/worker/filestore/filestore.sock;
    }

    server {
        listen 127.0.0.1:37431;

        if ($request_method != GET) { return 405; }
        if ($canonical_blob = 0) { return 404; }

        location / {
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host localhost;
            proxy_set_header Content-Length "";
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_pass http://filestore_relay;
        }
    }
}
