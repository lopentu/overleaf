services:
  sharelatex:
    image: ${OVERLEAF_IMAGE:?Set OVERLEAF_IMAGE to the verified fork image ID or digest}
    pull_policy: never
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 8g
    cpus: 4
    env_file:
      - ${OVERLEAF_APP_ENV_FILE:?Set OVERLEAF_APP_ENV_FILE to the absolute path of your private app.env}
    environment:
      OVERLEAF_MONGO_URL: mongodb://mongo:27017/sharelatex?replicaSet=rs0
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis
      V1_HISTORY_URL: http://sharelatex:3100/api
      BLOCK_CROSS_ORIGIN_REQUESTS: 'true'
      OVERLEAF_ENABLE_REGISTER_PAGE: 'false'
      OVERLEAF_RESTRICT_INVITES_TO_EXISTING_ACCOUNTS: 'true'
      OVERLEAF_ALLOW_ANONYMOUS_READ_AND_WRITE_SHARING: 'false'
      GIT_BRIDGE_ENABLED: 'false'
      DOCKER_RUNNER: 'false'
      SANDBOXED_COMPILES: 'false'
      SANDBOXED_COMPILES_SIBLING_CONTAINERS: 'false'
    ports:
      - '127.0.0.1:${OVERLEAF_HTTP_PORT:-8080}:80'
    volumes:
      - type: volume
        source: overleaf
        target: /var/lib/overleaf
        volume:
          nocopy: true
      - type: bind
        source: ./deploy/block-bootstrap.conf
        target: /etc/nginx/vhost-extras/overleaf/10-block-bootstrap.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      - frontend
      - backend
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1/status']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s

  mongo:
    image: ${MONGO_IMAGE:?Set MONGO_IMAGE to the verified MongoDB image ID or digest}
    pull_policy: never
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    stop_grace_period: 60s
    mem_limit: 2g
    cpus: 1
    volumes:
      - type: volume
        source: mongo
        target: /data/db
        volume:
          nocopy: true
      - type: volume
        source: mongo-configdb
        target: /data/configdb
        volume:
          nocopy: true
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          'quit(db.hello().isWritablePrimary ? 0 : 1)',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE to the verified Redis image ID or digest}
    pull_policy: never
    restart: unless-stopped
    command:
      ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    stop_grace_period: 60s
    mem_limit: 512m
    cpus: 0.5
    volumes:
      - type: volume
        source: redis
        target: /data
        volume:
          nocopy: true
    networks:
      - backend
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 6

# Only the web container uses a non-internal network so Docker can publish its
# HTTP port on the host. MongoDB and Redis have no published ports or egress.
networks:
  frontend:
  backend:
    internal: true

volumes:
  overleaf:
  mongo:
  mongo-configdb:
  redis:
