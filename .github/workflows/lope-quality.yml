name: LOPE quality
on:
  pull_request:
  push:
    branches: [ext-ce]
permissions:
  contents: read
jobs:
  lope-quality:
    name: LOPE quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.1'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/git-bridge/pom.xml
      - name: Install pinned Apache Maven
        run: |
          curl --fail --silent --show-error --location https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz --output "$RUNNER_TEMP/maven.tar.gz"
          echo '831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  '"$RUNNER_TEMP/maven.tar.gz" | sha512sum --check --strict
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Install pinned hook runner
        run: |
          python3 -m venv .lope-tools
          .lope-tools/bin/pip install pre-commit==4.6.2
          corepack yarn --version
      # Includes strict types and offline fixture regressions for image-only
      # dependency projection; its physical inventory needs separate local audit.
      - name: Run the same blocking hooks as local commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          .lope-tools/bin/pre-commit run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA" --show-diff-on-failure
      - name: Download complete public advisory data and pinned official scanner
        run: |
          set -euo pipefail
          audit_downloads="$RUNNER_TEMP/overleaf-osv-downloads"
          mkdir -m 700 "$audit_downloads"
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 180 --max-filesize 134217728 https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64 --output "$audit_downloads/osv-scanner"
          echo 'fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  '"$audit_downloads/osv-scanner" | sha256sum --check --strict
          chmod 500 "$audit_downloads/osv-scanner"
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 180 --max-filesize 1073741824 --dump-header "$audit_downloads/npm-headers.txt" https://storage.googleapis.com/osv-vulnerabilities/npm/all.zip --output "$audit_downloads/npm-all.zip"
      - name: Strict generated physical runtime audit (offline; high and critical)
        run: corepack yarn node server-ce/runtime-audit.cjs --ci-runtime-audit
