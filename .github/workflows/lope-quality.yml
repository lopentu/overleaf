name: LOPE quality
on:
  pull_request:
  push:
    branches: [ext-ce]
permissions:
  contents: read
jobs:
  lope-quality:
    name: LOPE quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.1'
      - name: Install pinned hook runner
        run: |
          python3 -m venv .lope-tools
          .lope-tools/bin/pip install pre-commit==4.6.2
          corepack yarn --version
      - name: Run the same blocking hooks as local commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          .lope-tools/bin/pre-commit run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA" --show-diff-on-failure
      - name: Fresh production dependency audit (high and critical)
        run: |
          test "$(corepack yarn config get npmAuditExcludePackages --json)" = '[]'
          test "$(corepack yarn config get npmAuditIgnoreAdvisories --json)" = '[]'
          corepack yarn npm audit --all --recursive --environment production --severity high --json --no-deprecations
